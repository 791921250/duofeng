/* ---------- 月结：入夜 ---------- */
async function nightfall(){
  if(busy||!S||S.ended)return;
  if(S.ap>0&&!confirm(`尚有 ${S.ap} 点行动力，确定入夜？未用的行动力不会留存。`))return;
  nightLock=true;busy=true;
  const report=[];
  S.flags.noServe=false;
  const income=totalIncome();
  S.money+=income;
  report.push(`产业与月例入账 ${fmt(income)} 两`);
  S.log.unshift(`第 ${S.month} 月月结，入账 ${fmt(income)} 两`);
  renderGame();
  await wait(240);

  await rivalNight(report);
  if(S.ended){nightLock=false;busy=false;return}

  await serveNight(report);
  if(S.ended){nightLock=false;busy=false;return}

  if(S.pregnant)await pregnancyNight(report);
  if(S.ended){nightLock=false;busy=false;return}

  await eventNight(report);
  if(S.ended){nightLock=false;busy=false;return}

  const exposed=await karmaNight(report);
  if(exposed||S.ended){nightLock=false;busy=false;return}

  const ended=await promoteCheck();
  if(ended){nightLock=false;busy=false;return}

  if(S.month>=24){
    finishGame('time');
    nightLock=false;busy=false;
    return;
  }
  S.month++;S.ap=5;
  monthlyDrift(report);
  save();renderGame();
  nightLock=false;busy=false;
  showMonthSummary(report);
}

async function rivalNight(report){
  const eligible=RIVALS.filter(r=>S.bonds[r.id]<60&&S.rivals[r.id].favor>=8);
  if(!eligible.length)return;
  const chance=clamp(5+S.favor*.16-S.attrs.wit*.08+(S.flags.grudge?4:0),2,30);
  if(rnd(1,100)>chance)return;
  const r=pick(eligible);
  const def=S.attrs.wit+rnd(0,30);
  const atk=r.wit+rnd(0,24);
  if(def>=atk){
    const chips=applyEff({scheme:2});
    S.log.unshift(`识破 ${r.name} 的暗手`);
    report.push(`${r.name}暗中使绊，被你识破`);
    await scene({
      locked:true,kind:'hall',who:r.id,kicker:'后宫暗流',title:'被按住的手',loc:r.title||'宫中',
      body:[
        `你宫里的小宫女今日心神不宁，说话时总往袖子里瞟。你让人把她带下去一问，果然问出了东西。`,
        `是${r.name}的人递来的“问候”。你把那包药粉倒进香炉，看着它烧成一小撮黑灰。`,
        '这宫里，没有谁会无缘无故地恨你。可也没有谁会无缘无故地放过你。'
      ],
      chips,choices:[{label:'记 下'}]
    });
    return;
  }
  let eff={fame:-rnd(5,11),favor:-rnd(3,6)};
  /* 流言既已传入帝王耳中，本月不再翻牌，与侍寝流程保持一致 */
  S.flags.noServe=true;
  let body=[
    '半夜，你被一阵凉意惊醒。窗子开着，妆台上的东西被动过，镜面朝下扣着。',
    `第二天一早，宫里就传开了：${r.name}身边的人说，你的宫女夜里私会外男。人证物证，来得太快，快得像早就备好了。`,
    '帝王没有问，只是这个月再没翻过你的牌子。'
  ];
  if(S.pregnant&&rnd(1,100)<=38){
    if(rnd(1,100)<=45){
      S.pregnant=null;
      eff.health=-10;eff.karma=4;
      body.push('你捂着腹部，感觉到一阵温热的坠落。太医赶来时，已经晚了。');
    }else{
      body.push('你死死护住腹部，直到宫女们把人拉开。孩子还在，可你出了一身冷汗。');
      eff.health=-3;
    }
  }
  const chips=applyEff(eff);
  S.log.unshift(`遭 ${r.name} 暗算`);
  report.push(`遭${r.name}暗算，威望与帝宠受损`);
  await scene({
    locked:true,kind:'hall',who:r.id,kicker:'后宫暗流',title:'夜里开着的窗',loc:r.title||'宫中',
    body,chips,choices:[{label:'忍 下'}]
  });
}

async function serveNight(report){
  if(S.pregnant){
    report.push('有孕在身，敬事房未再翻牌');
    return;
  }
  if(S.flags.noServe){
    report.push('流言未散，敬事房今夜没有翻你的牌子');
    return;
  }
  const playerW=24+S.favor*2.2+Math.floor(S.attrs.charm*.15);
  const pool=RIVALS.map(r=>({id:r.id,w:Math.max(4,S.rivals[r.id].favor)}));
  const total=playerW+pool.reduce((n,x)=>n+x.w,0);
  const roll=rnd(1,Math.max(1,Math.round(total)));
  if(roll>playerW){
    let acc=Math.round(playerW);
    let chosen=pool[0];
    for(const x of pool){acc+=x.w;if(roll<=acc){chosen=x;break}}
    const rr=rivalOf(chosen.id);
    report.push(`今夜敬事房的灯笼落在了${rr.name}门前`);
    S.rivals[chosen.id].favor=clamp(S.rivals[chosen.id].favor+1,0,100);
    return;
  }
  let declined=false;
  await scene({
    locked:true,kind:'night',who:'emperor',kicker:'侍寝',title:'今夜承恩',loc:'养心殿 · 内殿',
    body:[
      '敬事房的灯笼在你的门前停下。你被宫人伺候着沐浴、更衣，裹进一床锦被，抬进养心殿。',
      '殿里只点了一盏灯。帝王靠在榻上看折子，听见动静，抬眼看了你一会儿。',
      '“过来。”他说。'
    ],
    choices:[
      {label:'婉转承欢',hint:'帝宠 +8~14',run:()=>{
        S.served++;
        const f=rnd(8,14)+Math.floor(S.attrs.charm*.03);
        return {text:'帐子落下来。他今夜心情不坏，甚至在你耳边说了两句闲话。你听着，应着，把每一个字都记在心里。',eff:{favor:f}};
      }},
      {label:'清谈伴驾',hint:'帝宠 +6~11 · 心机 +2',run:()=>{
        S.served++;
        const f=rnd(6,11)+Math.floor(S.attrs.wit*.03);
        return {text:'你没有急着靠近，只替他续了茶，顺着折子上的话头说了两句。他有些意外，竟与你聊到了三更。',eff:{favor:f,scheme:2}};
      }},
      {label:'称病告退',hint:'帝宠 -4 · 保全自身',run:()=>{
        declined=true;

async function pregnancyNight(report){
  if(!S.pregnant)return;
  if(S.pregnant.fresh){
    S.pregnant.fresh=false;
    return;
  }
  S.pregnant.m++;
  if(S.pregnant.m<3){
    report.push(`有孕 ${S.pregnant.m} 月，胎象尚稳`);
    return;
  }
  await birthScene(report);
}

async function birthScene(report){
  const risk=birthRiskBase();
  const difficult=rnd(1,100)<=risk;
  const boy=rnd(1,100)<=52;
  if(difficult){
    await scene({
      locked:true,kind:'night',kicker:'产房 · 生死',title:'保母，还是保子',loc:'储秀宫 · 产房',
      body:[
        '羊水破在半夜。稳婆的手上全是血，太医在外间来回踱步。',
        `“娘娘，胎位不正……”稳婆跪在榻前，声音发抖，“只能保一个。”`,
        '烛火晃了一下。你疼得几乎看不清她的脸。'
      ],
      choices:[
        {label:'保 母',hint:'失去孩子 · 体质 -8 · 帝宠 -5',run:()=>{
          S.pregnant=null;S.flags.safeBirth=false;
          return {text:'你听见一声很轻的啼哭，然后就没了。稳婆说，是个成形的男胎。你闭上眼睛，眼泪从眼角滑进鬓发里。',eff:{health:-8,favor:-5,fame:-5}};
        }},
        {label:'保 子',hint:'四成可能香消玉殒',run:()=>{
          if(rnd(1,100)<=40){
            S.flags.dead=true;
            S.children++;
            S.pregnant=null;S.flags.safeBirth=false;
            return {text:'你用尽最后的力气说：“保孩子。”血一层层漫开，烛火越来越远。最后听见的，是一声嘹亮的啼哭。',eff:{}};
          }
          S.children++;
          S.pregnant=null;S.flags.safeBirth=false;
          return {text:'你几乎把牙咬碎。不知过了多久，一声啼哭划破产房的死寂。稳婆抱着孩子跪下来：“恭喜娘娘，是位小皇子。”',eff:{health:-16,favor:5,fame:12}};
        }}
      ]
    });
    if(S.flags.dead){
      report.push('难产血崩');
      finishGame('death');
      return;
    }
    report.push(S.children>0?'难产，母子平安':'难产，未能保住孩子');
    return;
  }
  const eff={health:-5,favor:5,fame:12};
  let extra='';
  if(S.rank<3&&rnd(1,100)<=35){
    eff.fame+=10;eff.favor-=5;
    extra='孩子满月那日，皇后宫里来人，说皇嗣尊贵，应由高位抚育。你抱着孩子不肯松手，最后还是被嬷嬷接了过去。';
  }
  S.children++;S.pregnant=null;S.flags.safeBirth=false;
  const chips=applyEff(eff);
  chips.unshift({t:'子嗣 +1',cls:'gold'});
  S.log.unshift('诞下'+(boy?'皇子':'公主'));
  report.push('诞下'+(boy?'皇子':'公主'));
  await scene({
    locked:true,kind:'night',kicker:'生产',title:boy?'麟儿':'明珠',loc:'储秀宫 · 产房',
    body:[
      '天快亮的时候，孩子出生了。稳婆把他擦干净，包进早就备好的锦缎里，抱到你枕边。',
      '他那么小，皱巴巴的，眼睛还睁不开。你伸出手指碰了碰他的脸，忽然想哭。',
      extra||'帝王来看过一次，站了片刻，给孩子赐了名。你抱着孩子，觉得这宫里的风，好像也没那么冷了。'
    ],
    chips,choices:[{label:'抱 紧 他'}]
  });
}

async function eventNight(report){
  let ev=null;
  const fixed=FIXED_EVENTS.find(e=>e.month===S.month&&!S.flags['ev_m'+e.month]&&(!e.cond||e.cond()));
  if(fixed){
    ev=fixed;S.flags['ev_m'+fixed.month]=true;
  }else if(rnd(1,100)<=58){
    /* 只抽没遭遇过的风波，抽完就过安稳夜，不再重复旧剧情 */
    const pool=EVENTS.filter(e=>(!e.cond||e.cond())&&!S.flags['ev_'+e.id]);
    if(pool.length)ev=pick(pool);
  }
  if(!ev){
    report.push('宫中无大事，一夜安眠');
    return;
  }
  S.flags['ev_'+ev.id]=true;
  S.log.unshift('风波 · '+ev.title);
  report.push('宫中风波：'+ev.title);
  await scene({
    locked:true,kind:ev.kind||'hall',who:ev.who,kicker:ev.kicker,title:ev.title,loc:ev.loc,
    body:ev.body,choices:ev.choices
  });
  save();renderGame();
}

function calcEnding(){
  if(S.flags.dead)return 'death';
  if(S.flags.escape)return 'escape';
  if(S.karma>=90)return 'white';
  if(S.karma>=60||S.flags.exposed)return 'cold';
  if(S.rank>=7){
    return (S.children>=1&&S.money>=1500&&S.karma<40)?'queen_glory':'queen_lonely';
  }
  if(S.rank>=5){
    if(S.favor>=80)return 'favor';
    if(S.money>=3000)return 'power';
    if(S.favor<40)return 'empty';
    return 'deep';
  }
  if(S.rank>=3){
    if(S.children>=2&&familyPower()>=90&&S.money>=1200)return 'taihou';
    if(S.children>=1)return 'mother';
    if(S.money>=2000)return 'goldcage';
    return 'deep';
  }
  if(S.money>=2500)return 'rich';
  if(familyPower()>=80)return 'clan';
  if(S.children>=1)return 'mother';
  return 'dream';
}
function finishGame(reason){
  if(!S||S.ended)return;
  const id=calcEnding();
  S.ended=id;
  const e=ENDINGS.find(x=>x.id===id)||ENDINGS[ENDINGS.length-1];
  const gal=loadGal();
  if(gal.endings.indexOf(id)<0)gal.endings.push(id);
  ACHS.forEach(a=>{try{if(a.cond(S)&&gal.achs.indexOf(a.id)<0)gal.achs.push(a.id)}catch(err){}});
  saveGal(gal);save();
  sceneResolve=null;sceneCfg=null;nightLock=false;busy=false;
  $('scene').hidden=true;$('sheet').hidden=true;
  renderEnding(e);
}

function monthlyDrift(report){
  S.favor=clamp(S.favor-1,0,100);
  if(S.flags.curse){
    S.favor=clamp(S.favor-2,0,100);
    S.karma=clamp(S.karma+1,0,100);
  }
  if(S.flags.loveGu)S.favor=clamp(S.favor-1,0,100);
  RIVALS.forEach(r=>{
    S.rivals[r.id].favor=clamp(S.rivals[r.id].favor+rnd(0,3),0,100);
  });
  const allies=Object.keys(S.bonds).filter(id=>S.bonds[id]>=60);
  if(allies.length){
    const gain=allies.length*2;
    S.fame+=gain;
    report.push(`盟友相助，威望 +${gain}`);
  }
  if(hasRetainer('cui')){
    S.fame+=2;
    report.push('崔姑姑替你在六宫周旋，威望 +2');
  }
  S.log=S.log.slice(0,40);
}

function initPetals(){
  const cv=$('petals');
  if(!cv)return;
  const ctx=cv.getContext('2d');
  let W=0,H=0;
  const dpr=Math.min(2,window.devicePixelRatio||1);
  function resize(){
    W=cv.clientWidth||window.innerWidth;
    H=cv.clientHeight||window.innerHeight;
    cv.width=W*dpr;cv.height=H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  resize();
  window.addEventListener('resize',resize);
  const ps=Array.from({length:24},()=>({
    x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*2.1,
    s:.12+Math.random()*.35,d:Math.random()*.3-.15,a:.12+Math.random()*.3,
    rot:Math.random()*Math.PI,t:Math.random()*100
  }));
  let last=performance.now();
  function frame(now){
    const dt=Math.min(48,now-last);last=now;
    ctx.clearRect(0,0,W,H);
    for(const p of ps){
      p.y+=p.s*dt*.05;
      p.x+=Math.sin((now+p.t*1000)/3200)*.12+p.d*.02;
      p.rot+=.0004*dt;
      if(p.y>H+12){p.y=-12;p.x=Math.random()*W}
      if(p.x<-12)p.x=W+12;if(p.x>W+12)p.x=-12;
      ctx.save();
      ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      ctx.fillStyle=`rgba(214,154,132,${p.a})`;
      ctx.beginPath();ctx.ellipse(0,0,p.r*1.5,p.r*.55,0,0,Math.PI*2);ctx.fill();
      ctx.restore();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function init(){
  initPetals();
  if(ART.boot&&$('bootArt')&&typeof Image!=='undefined'){
    const im=new Image();
    im.onload=()=>{
      $('bootArt').style.background='#050404 url("'+ART.boot+'") center 20%/cover no-repeat';
      $('bootArt').querySelectorAll('svg,.moon,.lantern').forEach(x=>{x.style.display='none'});
    };
    im.src=ART.boot;
  }
  /* 首屏先出，其余插画空闲时再预热解码，缩短打开时间 */
  const warm=()=>{
    Object.keys(FAM_ART).forEach(k=>{
      const s=FAM_ART[k];
      if(!s)return;
      const im=new Image();
      im.src=s;
      if(im.decode)im.decode().catch(()=>{});
    });
    Object.keys(FAM_FACE).forEach(k=>{
      const s=FAM_FACE[k];
      if(!s)return;
      const im=new Image();
      im.src=s;
      if(im.decode)im.decode().catch(()=>{});
    });
    [typeof HAN_RANK_ART!=='undefined'?HAN_RANK_ART:[],typeof SHU_RANK_ART!=='undefined'?SHU_RANK_ART:[],typeof SHANG_RANK_ART!=='undefined'?SHANG_RANK_ART:[]].forEach(arr=>arr.forEach(s=>{
      if(!s)return;
      const im=new Image();
      im.src=s;
      if(im.decode)im.decode().catch(()=>{});
    }));
  };
  if(window.requestIdleCallback)requestIdleCallback(warm,{timeout:900});else setTimeout(warm,150);
  const saved=loadSave();
  if(saved&&!saved.ended)$('btnContinue').hidden=false;

  $('btnStart').onclick=()=>{
    const name=($('nameInput').value||'').trim();
    if(!name){showToast('请先留下闺名');$('nameInput').focus();return}
    if(saved&&!saved.ended&&!confirm('已有旧存档，入局将覆盖它。确定吗？'))return;
    $('boot').hidden=true;$('create').hidden=false;
    sel={familyId:null,attrs:null,scheme:0,rerolls:3};
    renderCreate();
  };
  $('btnContinue').onclick=()=>{
    const s=loadSave();
    if(!s){showToast('没有找到存档');return}
    if(!s.attrs)s.attrs={family:40,charm:50,health:50,wit:50,talent:50,social:50};
    ['fame','money','favor','karma','scheme','children','served','month','ap','rank'].forEach(k=>{
      if(!isFinite(s[k]))s[k]=k==='scheme'?20:0;
    });
    S=s;busy=false;nightLock=false;
    $('boot').hidden=true;$('create').hidden=true;$('game').hidden=false;
    renderGame();
    showToast('已续前缘');
  };
  $('btnGallery').onclick=showGallery;
  $('btnHelp').onclick=showHelp;
  $('btnBackBoot').onclick=()=>{$('create').hidden=true;$('boot').hidden=false};
  $('btnCreate').onclick=()=>{
    if(!sel.familyId){showToast('请先择一身世');return}
    startGame();
  };
  $('btnRoll').onclick=()=>{
    if(sel.rerolls<=0||!sel.familyId)return;
    sel.rerolls--;
    const f=FAMILIES.find(x=>x.id===sel.familyId);
    sel.attrs=rollAttrs(f);
    sel.scheme=clamp(rnd(10,26)+Math.floor(sel.attrs.wit/22),8,42);
    renderCreate();
  };
  $('nameInput').oninput=()=>{
    if(!$('create').hidden)$('crName').textContent=($('nameInput').value||'待定').trim()||'待定';
  };
  $('btnMenu').onclick=openMenu;
  $('fabNight').onclick=nightfall;
  document.querySelectorAll('.tab').forEach(b=>{b.onclick=()=>setTab(b.dataset.tab)});

  $('main').addEventListener('click',e=>{
    const place=e.target.closest('[data-place]');
    if(place){askPlace(place.dataset.place);return}
    const up=e.target.closest('[data-bld-up]');
    if(up){upgradeBuilding(up.dataset.bldUp);return}
    const as=e.target.closest('[data-bld-assign]');
    if(as){openAssign(as.dataset.bldAssign);return}
    const rv=e.target.closest('[data-rival]');
    if(rv){openSchemeSheet(rv.dataset.rival);return}
    const gf=e.target.closest('[data-gift]');
    if(gf){giftRival(gf.dataset.gift);return}
    const rc=e.target.closest('[data-recruit]');
    if(rc){recruit(rc.dataset.recruit);return}
    const it=e.target.closest('[data-use-item]');
    if(it){useItem(it.dataset.useItem);return}
    if(e.target.closest('[data-gallery]')){showGallery();return}
    if(e.target.closest('[data-escape]')){escapeNow();return}
  });

  $('ending').addEventListener('click',e=>{
    const b=e.target.closest('[data-end]');
    if(!b)return;
    if(b.dataset.end==='restart'){
      if(confirm('再开一局？本局进度将清空，结局图鉴保留。')){
        try{localStorage.removeItem(SAVE_KEY)}catch(err){}
        location.reload();
      }
    }else if(b.dataset.end==='gallery')showGallery();
  });

  $('nameInput').addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();$('btnStart').click()}
  });
}

<script>
/* 标注模式：网址后加 #pick 开启，点任意板块即在底部显示它的标识，方便沟通改版 */
(function(){
  if(!/pick/i.test(location.hash))return;
  var st=document.createElement('style');
  st.textContent='.pk-hl{outline:2px dashed #c9a86a!important;outline-offset:-2px!important}'
    +'.pk-bar{position:fixed;left:0;right:0;bottom:0;z-index:99999;padding:10px 14px 12px;'
    +'background:rgba(8,12,9,.97);border-top:1px solid rgba(201,168,106,.55);color:#f0dcae;'
    +'font:12px/1.65 "PingFang SC","Microsoft YaHei",sans-serif;box-shadow:0 -12px 30px rgba(0,0,0,.6)}'
    +'.pk-bar b{display:block;color:#fff;font-size:13px;word-break:break-all}'
    +'.pk-bar i{display:block;font-style:normal;color:#93a196;font-size:11px;margin-top:2px;word-break:break-all}'
    +'.pk-bar .pk-act{display:flex;gap:8px;margin-top:8px}'
    +'.pk-bar button{padding:5px 12px;border:1px solid rgba(201,168,106,.5);color:#f0dcae;'
    +'background:rgba(201,168,106,.1);font-size:11px;letter-spacing:.08em}';
  document.head.appendChild(st);
  var bar=document.createElement('div');
  bar.className='pk-bar';
  bar.innerHTML='<b>标注模式 · 点一下要改的板块</b><i>底部会显示它的标识与尺寸，把这行字告诉我即可</i>';
  var cur=null;
  function copyText(t){
    if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).catch(function(){});return}
    var ta=document.createElement('textarea');
    ta.value=t;ta.style.cssText='position:fixed;top:-999px;opacity:0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy')}catch(e){}
    ta.remove();
  }
  document.addEventListener('click',function(e){
    if(bar.contains(e.target))return;
    e.preventDefault();e.stopPropagation();
    if(cur)cur.classList.remove('pk-hl');
    cur=e.target;cur.classList.add('pk-hl');
    var path=[],n=cur;
    for(var i=0;i<4&&n&&n!==document.body;i++){
      var s=n.tagName.toLowerCase();
      if(n.id)s+='#'+n.id;
      else if(typeof n.className==='string'&&n.className.trim())s+='.'+n.className.trim().split(/\s+/).slice(0,3).join('.');
      path.unshift(s);n=n.parentElement;
    }
    var txt=(cur.innerText||cur.getAttribute('alt')||'').replace(/\s+/g,' ').trim().slice(0,28);
    var r=cur.getBoundingClientRect();
    var id=path.join(' > ');
    var info='内容：'+(txt||'（无文字）')+' ｜ 尺寸 '+Math.round(r.width)+'×'+Math.round(r.height);
    bar.innerHTML='<b>'+id+'</b><i>'+info+'</i><div class="pk-act"><button data-a="c">复制标识</button><button data-a="x">退出标注</button></div>';
    bar.querySelector('[data-a=c]').onclick=function(){copyText(id+' | '+info);this.textContent='已复制'};
    bar.querySelector('[data-a=x]').onclick=function(){
      if(cur)cur.classList.remove('pk-hl');
      bar.remove();st.remove();
      history.replaceState(null,'',location.pathname);
    };
  },true);
  (function mount(){document.body?document.body.appendChild(bar):document.addEventListener('DOMContentLoaded',mount)})();
})();
</script>
